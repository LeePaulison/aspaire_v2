type CareerProfile {
  profileId: String!
  name: String!
  focus: String!
  isDefault: Boolean!
  headline: String!
  summary: String!
  careerGoals: String!
  contactInfo: CareerProfileContactInfo!
  additionalNotes: String!
  experience: [CareerExperience!]!
  education: [CareerEducation!]!
  skills: [CareerSkill!]!
  projects: [CareerProject!]!
  certifications: [CareerCertification!]!
  preferences: CareerProfilePreferences
}

type CareerProfileContactInfo {
  email: String!
  phone: String!
  location: String!
  links: [CareerProfileContactLink!]!
}

type CareerProfileContactLink {
  label: String!
  url: String!
}

type CareerExperience {
  experienceId: String!
  company: String!
  title: String!
  location: String!
  startDate: String
  endDate: String
  isCurrent: Boolean!
  description: String!
  achievements: [String!]!
  sortOrder: Int!
}

type CareerEducation {
  educationId: String!
  institution: String!
  degree: String!
  fieldOfStudy: String!
  startDate: String
  endDate: String
  notes: String!
  sortOrder: Int!
}

type CareerSkill {
  skillId: String!
  name: String!
  category: String!
  proficiency: String!
  evidence: String!
  sortOrder: Int!
}

type CareerProject {
  projectId: String!
  name: String!
  role: String!
  description: String!
  outcomes: String!
  technologies: [String!]!
  link: String!
  startDate: String
  endDate: String
  sortOrder: Int!
}

type CareerCertification {
  certificationId: String!
  name: String!
  issuer: String!
  issueDate: String
  expirationDate: String
  credentialId: String!
  credentialUrl: String!
  notes: String!
  sortOrder: Int!
}

type CareerProfilePreferences {
  preferenceId: String!
  targetRoles: [String!]!
  targetIndustries: [String!]!
  locations: [String!]!
  workModes: [String!]!
  compensationGoals: String!
  constraints: String!
}

input CreateCareerProfileInput {
  name: String
  focus: String
  isDefault: Boolean
  headline: String
  summary: String
  careerGoals: String
  contactInfo: CareerProfileContactInfoInput
  additionalNotes: String
}

input UpdateCareerProfileSummaryInput {
  profileId: String
  name: String
  focus: String
  isDefault: Boolean
  headline: String
  summary: String
  careerGoals: String
  contactInfo: CareerProfileContactInfoInput
  additionalNotes: String
}

input CareerProfileContactInfoInput {
  email: String
  phone: String
  location: String
  links: [CareerProfileContactLinkInput!]
}

input CareerProfileContactLinkInput {
  label: String!
  url: String!
}

input UpsertCareerExperienceInput {
  profileId: String
  experienceId: String
  company: String!
  title: String!
  location: String!
  startDate: String
  endDate: String
  isCurrent: Boolean!
  description: String!
  achievements: String!
  sortOrder: Int
}

input UpsertCareerEducationInput {
  profileId: String
  educationId: String
  institution: String!
  degree: String!
  fieldOfStudy: String!
  startDate: String
  endDate: String
  notes: String!
  sortOrder: Int
}

input UpsertCareerSkillInput {
  profileId: String
  skillId: String
  name: String!
  category: String!
  proficiency: String!
  evidence: String!
  sortOrder: Int
}

input UpsertCareerProjectInput {
  profileId: String
  projectId: String
  name: String!
  role: String!
  description: String!
  outcomes: String!
  technologies: String!
  link: String!
  startDate: String
  endDate: String
  sortOrder: Int
}

input UpsertCareerCertificationInput {
  profileId: String
  certificationId: String
  name: String!
  issuer: String!
  issueDate: String
  expirationDate: String
  credentialId: String!
  credentialUrl: String!
  notes: String!
  sortOrder: Int
}

input UpdateCareerPreferencesInput {
  profileId: String
  targetRoles: String!
  targetIndustries: String!
  locations: String!
  workModes: String!
  compensationGoals: String!
  constraints: String!
}

input CreateCareerProfileFromDraftInput {
  name: String
  focus: String
  isDefault: Boolean
  headline: String
  summary: String
  careerGoals: String
  contactInfo: CareerProfileContactInfoInput
  additionalNotes: String
  experience: [CareerProfileDraftExperienceInput!]!
  education: [CareerProfileDraftEducationInput!]!
  skills: [CareerProfileDraftSkillInput!]!
  projects: [CareerProfileDraftProjectInput!]!
  certifications: [CareerProfileDraftCertificationInput!]!
  preferences: CareerProfileDraftPreferencesInput!
}

input CareerProfileDraftExperienceInput {
  company: String!
  title: String!
  location: String!
  startDate: String
  endDate: String
  isCurrent: Boolean!
  description: String!
  achievements: String!
  sortOrder: Int
}

input CareerProfileDraftEducationInput {
  institution: String!
  degree: String!
  fieldOfStudy: String!
  startDate: String
  endDate: String
  notes: String!
  sortOrder: Int
}

input CareerProfileDraftSkillInput {
  name: String!
  category: String!
  proficiency: String!
  evidence: String!
  sortOrder: Int
}

input CareerProfileDraftProjectInput {
  name: String!
  role: String!
  description: String!
  outcomes: String!
  technologies: String!
  link: String!
  startDate: String
  endDate: String
  sortOrder: Int
}

input CareerProfileDraftCertificationInput {
  name: String!
  issuer: String!
  issueDate: String
  expirationDate: String
  credentialId: String!
  credentialUrl: String!
  notes: String!
  sortOrder: Int
}

input CareerProfileDraftPreferencesInput {
  targetRoles: String!
  targetIndustries: String!
  locations: String!
  workModes: String!
  compensationGoals: String!
  constraints: String!
}

extend type Query {
  careerProfiles: [CareerProfile!]!
  careerProfile(profileId: String): CareerProfile
}

extend type Mutation {
  createCareerProfile(input: CreateCareerProfileInput): CareerProfile!
  createCareerProfileFromDraft(input: CreateCareerProfileFromDraftInput!): CareerProfile!
  deleteCareerProfile(profileId: String!): [CareerProfile!]!
  updateCareerProfileSummary(input: UpdateCareerProfileSummaryInput!): CareerProfile!
  upsertCareerExperience(input: UpsertCareerExperienceInput!): CareerProfile!
  deleteCareerExperience(experienceId: String!, profileId: String): CareerProfile!
  upsertCareerEducation(input: UpsertCareerEducationInput!): CareerProfile!
  deleteCareerEducation(educationId: String!, profileId: String): CareerProfile!
  upsertCareerSkill(input: UpsertCareerSkillInput!): CareerProfile!
  deleteCareerSkill(skillId: String!, profileId: String): CareerProfile!
  upsertCareerProject(input: UpsertCareerProjectInput!): CareerProfile!
  deleteCareerProject(projectId: String!, profileId: String): CareerProfile!
  upsertCareerCertification(input: UpsertCareerCertificationInput!): CareerProfile!
  deleteCareerCertification(certificationId: String!, profileId: String): CareerProfile!
  updateCareerPreferences(input: UpdateCareerPreferencesInput!): CareerProfile!
}
