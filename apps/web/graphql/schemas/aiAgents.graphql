type AiAgent {
  agentId: String!
  category: String!
  domain: String!
  workflowType: String!
  name: String!
  description: String!
  contextPolicy: String!
  toolPolicy: String!
  promptVersion: Int!
  enabled: Boolean!
  sortOrder: Int!
}

type AiAgentConfiguration {
  agentId: String!
  domain: String!
  workflowType: String!
  defaultModelId: String
  contextPolicy: String!
  toolPolicy: String!
  systemPrompt: String!
  promptVersion: Int!
}

type DomainPreference {
  domainPreferenceId: String!
  domain: String!
  workflowType: String!
  agentId: String
  defaultModelId: String
  temperature: Float
  defaultReasoningId: String
  defaultVerbosityId: String
  responseFormat: String!
  responseSchema: String
  enabled: Boolean!
}

extend type Query {
  aiAgents: [AiAgent!]!
  aiAgentConfiguration(agentId: String!): AiAgentConfiguration
  domainPreference(domain: String!, workflowType: String!): DomainPreference
}
