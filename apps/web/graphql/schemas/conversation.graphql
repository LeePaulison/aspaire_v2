type Message {
  role: String!
  content: String!
  createdAt: String!
}

type ConversationSummary {
  id: ID!
  domain: String!
  domainId: String
  updatedAt: String!
  preview: String
}

type Conversation {
  id: ID!
  userId: String!
  domain: String!
  domainId: String
  createdAt: String!
  updatedAt: String!
  messages: [Message!]!
}

type SaveConversationTurnPayload {
  conversationId: ID!
  preview: String!
  updatedAt: String!
}

input SaveConversationTurnInput {
  conversationId: ID
  domain: String
  domainId: String
  userMessage: String!
  assistantMessage: String!
}

extend type Query {
  conversations(domain: String, domainId: String): [ConversationSummary!]!
  conversation(id: ID!): Conversation
}

extend type Mutation {
  saveConversationTurn(input: SaveConversationTurnInput!): SaveConversationTurnPayload!
  deleteConversation(id: ID!): Boolean!
}
